<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>幼兒園排班管理系統</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #FFB7B2; --secondary: #B2E2F2; --accent: #FFDAC1;
            --text1: #5D5D5D; --text2: #8E8E8E; --text3: #BDBDBD;
            --bg: #FFF9F5; --card: #FFFFFF; --shadow: 0 4px 12px rgba(255, 183, 178, 0.15);
        }
        * { box-sizing: border-box; font-family: "PingFang TC", "Microsoft JhengHei", sans-serif; }
        body { background-color: var(--bg); color: var(--text1); margin: 0; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; }
        
        /* 日曆核心樣式 */
        .calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; }
        .day-cell { background: var(--card); border-radius: 12px; min-height: 100px; padding: 8px; box-shadow: var(--shadow); position: relative; cursor: pointer; }
        .day-cell.other-month { opacity: 0.4; }
        .day-cell.weekend { background-color: #FFF0F0; }
        .day-num { font-weight: bold; font-size: 1.1rem; margin-bottom: 5px; }
        
        /* 標籤樣式 */
        .tag { padding: 2px 6px; border-radius: 4px; font-size: 0.75rem; color: white; display: inline-block; margin: 1px; }
        .t-g { background-color: #B2E2F2; } /* 補休 */
        .t-o { background-color: #FFDAC1; color: #D48459; } /* 排班 */
        .list-item { border-bottom: 1px solid #EEE; padding: 10px 0; }
        
        /* 彈窗樣式 */
        .overlay { position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.4); display:none; justify-content:center; align-items:center; z-index:1000; }
        .modal { background: white; padding: 24px; border-radius: 16px; width: 90%; max-width: 500px; max-height: 80vh; overflow-y: auto; }
        .btn { border: none; border-radius: 8px; padding: 10px 16px; cursor: pointer; font-weight: 600; }
        .btn-g { background: var(--secondary); color: #4A8DA2; }
    </style>
</head>
<body>
    <div class="container">
        <div class="calendar-header">
            <h2 id="month-display">2026年 4月</h2>
            <div>
                <button class="btn btn-g" onclick="changeMonth(-1)">上個月</button>
                <button class="btn btn-g" onclick="changeMonth(1)">下個月</button>
            </div>
        </div>
        <div class="calendar-grid" id="calendar-body"></div>
    </div>

    <!-- 明細彈窗 -->
    <div id="ov-dayinfo" class="overlay" onclick="closeOv(event)">
        <div class="modal" onclick="event.stopPropagation()">
            <h3 id="di-title"></h3>
            <div id="di-content"></div>
            <div style="margin-top:20px; display:flex; gap:10px;">
                <button id="btn-day-add-sched" class="btn btn-g" style="display:none">新增排班</button>
                <button class="btn" style="background:#EEE" onclick="document.getElementById('ov-dayinfo').style.display='none'">關閉</button>
            </div>
        </div>
    </div>
</body>
</html>
<script>
// 假定資料結構與常數
const authState = { isAdmin: true }; // 測試用，實際應由登入狀態決定
let schedules = []; // 排班資料
let leaveRequests = []; // 一般請假
let compUseReqs = []; // 補休申請
const LEAVE_TYPES = { 'sick': {label:'病假', color:'t-r'}, 'personal': {label:'事假', color:'t-b'} };

// 格式化日期顯示
function fmtD(dstr) { return dstr.split('-').slice(1).join('/'); }

// 根據 ID 找老師資訊
function teacherById(id) { 
    const teachers = { 1: {name: '林老師', emoji: '👩‍🏫'}, 2: {name: '王老師', emoji: '🎨'} };
    return teachers[id];
}

// 核心功能：點擊日期顯示明細
function handleDayClick(dstr) {
  activeDateForSched = dstr;
  document.getElementById('di-title').innerHTML = `<span>📅</span> ${fmtD(dstr)} 明細`;
  
  const lv = leaveRequests.filter(r=>r.status==='approved'&&r.startDate<=dstr&&r.endDate>=dstr);
  const cp = compUseReqs.filter(r=>r.status==='approved'&&r.startDate<=dstr&&r.endDate>=dstr);
  const sc = schedules.filter(s=>s.date===dstr);
  
  let html = '<div class="sec-label">休假名單</div>';
  if(lv.length===0 && cp.length===0) {
    html += '<div class="empty"><p>無人休假</p></div>';
  } else {
    // 顯示一般請假
    lv.forEach(r=>{
      const t = teacherById(r.teacherId);
      const lt = LEAVE_TYPES[r.type];
      html += `<div class="list-item"><div class="li-name">${t?t.emoji+' '+t.name:'?'} <span class="tag ${lt.color}">${lt.label}</span></div></div>`;
    });
    // 顯示補休與具體時間
    cp.forEach(r=>{
      const t = teacherById(r.teacherId);
      const timeStr = (r.startDate === r.endDate) 
        ? `${r.startTime} - ${r.endTime}` 
        : `${fmtD(r.startDate)} ${r.startTime} - ${fmtD(r.endDate)} ${r.endTime}`;
        
      html += `<div class="list-item">
                 <div class="li-name">${t?t.emoji+' '+t.name:'?'} 
                   <span class="tag t-g">補休</span> 
                   <span style="font-size:12px; color:#8E8E8E; font-weight:600; margin-left:6px;">
                     <i class="fa-regular fa-clock"></i> ${timeStr}
                   </span>
                 </div>
               </div>`;
    });
  }

  // 管理員權限功能：排班顯示與刪除[cite: 3]
  if (authState.isAdmin) {
    html += '<div class="sec-label" style="margin-top:12px">今日排班人員</div>';
    if(sc.length===0) html += '<div class="empty"><p>尚無排班</p></div>';
    else {
      sc.forEach(s=>{
        const t = teacherById(s.teacherId);
        const shifts = [s.early?'早':'',s.main?'全':'',s.late?'晚':''].filter(Boolean).join('/');
        html += `<div class="list-item" style="display:flex; justify-content:space-between; align-items:center;">
                   <div class="li-name">${t?t.emoji+' '+t.name:'?'} <span class="tag t-o">${s.cls} - ${shifts}</span></div>
                   <button class="btn-sm" style="color:#FFB7B2; background:none; border:none; cursor:pointer;" onclick="deleteSched(${s.id})">
                     <i class="fa-solid fa-trash"></i>
                   </button>
                 </div>`;
      });
    }
    document.getElementById('btn-day-add-sched').style.display = 'inline-flex';
  } else {
    document.getElementById('btn-day-add-sched').style.display = 'none';
  }
  
  document.getElementById('di-content').innerHTML = html;
  document.getElementById('ov-dayinfo').style.display = 'flex';
}

// 刪除排班功能[cite: 3]
function deleteSched(id) {
    if(!confirm("確定要刪除此排班紀錄嗎？")) return;
    schedules = schedules.filter(s => s.id !== id);
    alert("已刪除排班");
    // 重新渲染畫面
    renderCalendar(); 
    document.getElementById('ov-dayinfo').style.display = 'none';
}
</script>
